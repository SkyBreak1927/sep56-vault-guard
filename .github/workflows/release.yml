name: Release binaries

# Builds the checker for the two platforms it is run on. Windows goes first:
# it is the platform most people downloading a prebuilt binary are on, and the
# one whose breakages are hardest to spot from a Linux-only CI run, so a
# failure there should stop the run before Linux spends any time.
#
# A manual run produces artifacts and nothing else. Only a pushed `v*` tag
# creates a release, and that release is a draft -- nothing is published
# without someone opening it and pressing the button.

on:
  push:
    tags:
      - 'v*'
    # TEMPORARY, removed again before this branch merges. See the previous
    # pair of commits: workflow_dispatch is only offered for a workflow that
    # already exists on the default branch.
    branches:
      - p1-29-release
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The runner images ship a stable Rust toolchain, so there is no
      # toolchain action to trust here. Recorded so a build can be traced to
      # the compiler that produced it.
      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      # Link the C runtime into the binary so it runs on a Windows that has
      # never had the Visual C++ Redistributable installed. Without this the
      # binary imports VCRUNTIME140.dll, which is usually present because
      # other software brings it along, but is not guaranteed on a clean
      # machine -- and the failure there is a dialog about a missing DLL,
      # which says nothing about what to install.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p sep56-vault-guard

      - name: Package
        shell: pwsh
        run: |
          $name = 'sep56-vault-guard-windows-x86_64'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/sep56-vault-guard.exe -DestinationPath "dist/$name.zip"
          # Same `<hash>  <file>` layout as sha256sum, so one habit checks
          # either platform's download.
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sep56-vault-guard-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release -p sep56-vault-guard

      - name: Package
        run: |
          name=sep56-vault-guard-linux-x86_64
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C target/release sep56-vault-guard
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sep56-vault-guard-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [windows, linux]
    # Only a pushed tag publishes anything. A manual run stops after the two
    # build jobs, leaving the artifacts to download from the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -l dist

      # Draft, so the tag landing never publishes a release on its own.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            dist/*
