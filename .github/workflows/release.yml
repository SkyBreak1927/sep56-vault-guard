name: Release binaries

# Builds the checker for the platforms it is run on. Windows goes first:
# it is the platform most people downloading a prebuilt binary are on, and the
# one whose breakages are hardest to spot from a Linux-only CI run, so a
# failure there should stop the run before Linux spends any time.
#
# A manual run produces artifacts and nothing else. Only a pushed `v*` tag
# creates a release, and that release is a draft -- nothing is published
# without someone opening it and pressing the button.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The runner images ship a stable Rust toolchain, so there is no
      # toolchain action to trust here. Recorded so a build can be traced to
      # the compiler that produced it.
      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      # Link the C runtime into the binary so it runs on a Windows that has
      # never had the Visual C++ Redistributable installed. Without this the
      # binary imports VCRUNTIME140.dll, which is usually present because
      # other software brings it along, but is not guaranteed on a clean
      # machine -- and the failure there is a dialog about a missing DLL,
      # which says nothing about what to install.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p sep56-vault-guard

      - name: Package
        shell: pwsh
        run: |
          $name = 'sep56-vault-guard-windows-x86_64'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/sep56-vault-guard.exe -DestinationPath "dist/$name.zip"
          # Same `<hash>  <file>` layout as sha256sum, so one habit checks
          # either platform's download.
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sep56-vault-guard-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: windows
    # Pinned, not ubuntu-latest: a binary links against the glibc of the image
    # that built it and will not run on an older one. 22.04 ships glibc 2.35,
    # so the result runs on any distribution at least that new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release -p sep56-vault-guard

      # Fail the job if the binary needs a newer glibc than 2.35, and print
      # the highest version it does need.
      - name: Check glibc requirement
        run: |
          max=2.35
          highest=$(objdump -T target/release/sep56-vault-guard |
            grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' |
            sort -uV | tail -n 1)
          echo "Highest GLIBC symbol version required: ${highest:-none}"
          top=$(printf '%s\n' "$max" "${highest:-0}" | sort -V | tail -n 1)
          if [ "$top" != "$max" ]; then
            echo "::error::binary requires GLIBC_$highest, newer than GLIBC_$max"
            exit 1
          fi

      - name: Package
        run: |
          name=sep56-vault-guard-linux-x86_64
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C target/release sep56-vault-guard
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sep56-vault-guard-linux-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: windows
    # macos-14 is Apple silicon; the x86_64 half is cross-compiled.
    runs-on: macos-14
    env:
      # Lowest macOS the binary will load on (Big Sur, the first arm64 macOS).
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          rustc --version
          cargo --version

      - name: Add targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release -p sep56-vault-guard --target aarch64-apple-darwin
          cargo build --release -p sep56-vault-guard --target x86_64-apple-darwin

      - name: Combine into a universal binary
        run: |
          mkdir -p out
          lipo -create \
            target/aarch64-apple-darwin/release/sep56-vault-guard \
            target/x86_64-apple-darwin/release/sep56-vault-guard \
            -output out/sep56-vault-guard

      # Diagnostic only, never fails the job: does the arm64 binary still run
      # straight after lipo, before any signing? The result goes in the log.
      - name: Probe unsigned binary (diagnostic)
        continue-on-error: true
        run: |
          set +e
          codesign -dv out/sep56-vault-guard
          codesign --verify --verbose=2 out/sep56-vault-guard
          ./out/sep56-vault-guard --help >/dev/null
          echo "unsigned universal binary ran: exit $?"

      # Apple silicon refuses to run unsigned arm64 code; ad-hoc is the
      # minimum. It is not a developer identity, so Gatekeeper still treats
      # a downloaded copy as from an unidentified developer.
      - name: Ad-hoc sign and verify
        run: |
          codesign --force --sign - out/sep56-vault-guard
          codesign -dv out/sep56-vault-guard
          codesign --verify --strict --verbose=2 out/sep56-vault-guard

      - name: Verify architectures and linkage
        run: |
          info=$(lipo -info out/sep56-vault-guard)
          echo "$info"
          echo "$info" | grep -q x86_64
          echo "$info" | grep -q arm64
          otool -L out/sep56-vault-guard
          # Everything after the first line (the file itself) must be a
          # system library.
          if otool -L out/sep56-vault-guard | tail -n +2 | grep -v -E '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "::error::binary links a non-system library"
            exit 1
          fi

      # Not a run against Testnet: no stellar on PATH, so preflight must stop.
      - name: Smoke test
        run: |
          ./out/sep56-vault-guard --help >/dev/null
          set +e
          env PATH=/usr/bin:/bin ./out/sep56-vault-guard \
            --vault CAMDXP2QABDOUMU6F6WPQ5HVKVXCD4MOWPLBZF4KHIBXAD7NT3AGYTNF \
            --output json > smoke.json
          code=$?
          set -e
          cat smoke.json
          echo "exit code: $code"
          [ "$code" -eq 2 ]
          jq -e 'type=="object" and has("error") and has("code") and has("problem") and has("fix")' smoke.json

      - name: Package
        run: |
          name=sep56-vault-guard-macos-universal
          chmod +x out/sep56-vault-guard
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/$name.tar.gz" -C out sep56-vault-guard
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" \
            && shasum -a 256 -c "$name.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sep56-vault-guard-macos-universal
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [windows, linux, macos]
    # Only a pushed tag publishes anything. A manual run stops after the
    # build jobs, leaving the artifacts to download from the run page.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -l dist

      # Draft, so the tag landing never publishes a release on its own.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            dist/*
