<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegis Vault — SEP-56 Conformance Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Aegis Vault</h1>
      <p class="subtitle">SEP-56 Conformance Checker</p>
    </div>
  </header>

  <main class="container">
    <section class="run-summary" id="run-summary">
      <!-- Filled in by app.js from results.json -->
    </section>

    <section class="checks">
      <h2>Check Results</h2>
      <div class="check-list" id="check-list">
        <!-- Check rows rendered by app.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Results shown are from the most recent CLI run against the reference vault, generated manually (<code>sep56-vault-guard --output json</code>) — not a live/real-time connection.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
